name: Reusable Link Check

# Shared markdown/HTML link checker for every repo in this org.
#
# Why this exists: dune-awakening-selfhost-docker's docs carried 6 dead-link
# occurrences (a 404ing pre-rename bot repo) undetected for a long time --
# this repo had no link-checker of any kind in CI. mentat-link already had
# its own (scripts/check-links.js, site-scoped); this gives every other repo
# the same mechanical backstop instead of relying on someone noticing by
# luck, per Project-Arrakis's own DevSecOps "evidence over hope" principle.
#
# Uses lychee (https://github.com/lycheeverse/lychee) -- a real, actively
# maintained link checker, not a hand-rolled script -- via its official
# GitHub Action, SHA-pinned like every other action reference in this org.
#
# Usage from a calling repo's own workflow:
#
#   jobs:
#     link-check:
#       uses: Project-Arrakis/.github/.github/workflows/reusable-link-check.yml@main
#
# Pin to a commit SHA instead of @main for a repo that wants to control
# exactly when it picks up changes to this shared workflow.

on:
  workflow_call:
    inputs:
      paths:
        description: "Glob(s) to check, space-separated. Defaults to markdown docs only -- widen for repos that also want HTML checked."
        type: string
        default: "docs/**/*.md README.md CHANGELOG.md"
      fail-on-error:
        description: "Fail the job on a broken link. Set false to report-only (e.g. while first adopting this on a repo with known-broken external links to triage)."
        type: boolean
        default: true
      fail-if-empty:
        description: >-
          Fail the job if zero checkable links are found in the given paths.
          Set false for a repo whose docs genuinely contain no live
          hyperlinks (e.g. only code-fenced example URLs, which lychee
          correctly never checks) -- lychee-action's own default (true)
          treats zero links as a likely misconfiguration, which is the
          right default everywhere else but a false positive here.
        type: boolean
        default: true
      exclude:
        description: >-
          A single regex (use alternation for more than one pattern, e.g.
          'foo|bar') passed through to lychee's --exclude. Use this for links
          that are correct but can never be verified anonymously -- most
          commonly a cross-repo link into one of this org's private repos
          (mentat, mentat-link, meta): GitHub does not serve rename-redirects
          or issue/content bodies to unauthenticated requests for a private
          repo, so a correct link 404s here regardless. Excluding the pattern
          means "not mechanically checked," not "verified" -- whoever adds a
          new such link is still responsible for getting the slug/number
          right by hand.
        type: string
        default: ""

jobs:
  link-check:
    name: link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # lychee-action's entrypoint runs this whole string through `eval`,
          # so an unquoted regex containing shell metacharacters (parens,
          # pipes, `$`) breaks parsing -- the exclude value must be wrapped
          # in its own quotes to survive eval as a single argument.
          args: >-
            --no-progress
            --accept 200,201,202,203,204,206,301,302,303,307,308
            ${{ inputs.exclude != '' && format('--exclude ''{0}''', inputs.exclude) || '' }}
            ${{ inputs.paths }}
          fail: ${{ inputs.fail-on-error }}
          failIfEmpty: ${{ inputs.fail-if-empty }}
